<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @media only screen and (max-width: 600px) {
                .container {
                    width: 100% !important;
                    padding: 10px !important;
                }
                .header p {
                    font-size: 2em !important;
                }
                .email-text p {
                    font-size: 1.2em !important;
                }
                .code-container p {
                    font-size: 2em !important;
                }
            }
            .header {
                    width: 100%;
                    background-color: rgb(24, 132, 239) !important;
                    border-radius: 6px;
            }
            .header p {
                color: black;
                font-size: 4em;
                font-weight: bold;
                font-style: oblique;
                margin: 0;
            }
            .email-text {
                width: 100%;
            }
            .email-text p {
                text-align: left;
                color: black;
                font-size: 1.5em;
                font-weight: 500;
            }
            .code-container {
                margin-top: .5em;
                margin-bottom: .5em;
                padding: 0.2em;
                border: 3px solid rgb(46, 45, 45);
                border-radius: 5px;
            }
            .code-container p {
                color: black;
                font-size: 300%;
                font-weight: 500;
                text-align: center;
                margin: 0;
            }    
        </style>
    </head>
    <body>
        <table class="header">
            <tr>
                <td>
                    <p>
                        Easy Shoes
                    </p>
                </td>
            </tr> 
        </table>
        <table class="container">
            <tr class="email-text">
                <td>
                    <p>Hi,</p>
                    <p>Here is the verification code for your Easy Shoes account: </p>
                </td>
            </tr>
            <tr class="code-container">
                <td>
                    <p>{{code}}</p>
                </td>
            </tr>
            <tr class="email-text">
                <td>
                    <p>Sincerely,</p>
                    <p>Easy Shoes Team</p>
                </td>
            </tr>
        </table>
    </body>
</html>
